name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
      - run: bun run check:shell
      - run: bun test
      - run: bun run typecheck
      - run: bun run build
      - name: Scan Git history for secrets
        run: >-
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --no-banner --config=/repo/.gitleaks.toml /repo

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Install smoke prerequisites
        run: sudo apt-get update && sudo apt-get install -y ripgrep zip unzip
      - run: bun install --frozen-lockfile
      - run: scripts/verify.sh

  container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t bittergit:test .
      - name: Confirm runtime tools
        run: >-
          docker run --rm --entrypoint sh bittergit:test -c
          'command -v unzip >/dev/null && command -v zipinfo >/dev/null &&
          git http-backend </dev/null >/dev/null 2>&1'
      - name: Confirm non-root runtime
        run: test "$(docker run --rm --entrypoint id bittergit:test -u)" != "0"
